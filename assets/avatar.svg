<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="fundo" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#6A2C91"/>
      <stop offset="0.6" stop-color="#3B1460"/>
      <stop offset="1" stop-color="#1A0830"/>
    </radialGradient>
    <linearGradient id="ouro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="1" stop-color="#E0A526"/>
    </linearGradient>
    <linearGradient id="tampa" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C98A12"/>
      <stop offset="0.35" stop-color="#FFE7A3"/>
      <stop offset="1" stop-color="#B8770C"/>
    </linearGradient>
    <linearGradient id="liquido" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD36E"/>
      <stop offset="1" stop-color="#F08A2E"/>
    </linearGradient>
    <linearGradient id="vidro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <clipPath id="corpo">
      <rect x="340" y="440" width="344" height="356" rx="62"/>
    </clipPath>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- fundo -->
  <rect width="1024" height="1024" fill="url(#fundo)"/>

  <!-- mira do caçador -->
  <g stroke="url(#ouro)" stroke-linecap="round" fill="none">
    <circle cx="512" cy="530" r="372" stroke-width="18" opacity="0.95"/>
    <circle cx="512" cy="530" r="318" stroke-width="6" opacity="0.45"/>
    <line x1="512" y1="118" x2="512" y2="222" stroke-width="22"/>
    <line x1="512" y1="838" x2="512" y2="942" stroke-width="22"/>
    <line x1="100" y1="530" x2="204" y2="530" stroke-width="22"/>
    <line x1="820" y1="530" x2="924" y2="530" stroke-width="22"/>
  </g>

  <!-- frasco -->
  <g filter="url(#sombra)">
    <!-- tampa -->
    <rect x="428" y="250" width="168" height="130" rx="26" fill="url(#tampa)"/>
    <rect x="446" y="268" width="22" height="94" rx="11" fill="#FFF3CF" opacity="0.7"/>
    <!-- gargalo -->
    <rect x="466" y="372" width="92" height="78" rx="10" fill="#D99A1E"/>
    <!-- corpo: vidro -->
    <rect x="332" y="432" width="360" height="372" rx="70" fill="url(#vidro)"
          stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="16"/>
    <!-- líquido -->
    <g clip-path="url(#corpo)">
      <path d="M330 560 C 420 528, 500 592, 590 556 S 690 540, 700 548 L700 810 L330 810 Z"
            fill="url(#liquido)"/>
      <path d="M330 560 C 420 528, 500 592, 590 556 S 690 540, 700 548"
            fill="none" stroke="#FFF1C2" stroke-width="8" opacity="0.8"/>
    </g>
    <!-- brilho do vidro -->
    <rect x="372" y="474" width="34" height="250" rx="17" fill="#FFFFFF" opacity="0.6"/>
    <rect x="420" y="474" width="14" height="120" rx="7" fill="#FFFFFF" opacity="0.4"/>
  </g>

  <!-- etiqueta de preço com % -->
  <g transform="rotate(-18 700 430)">
    <path d="M612 380 L752 380 Q772 380 772 400 L772 480 Q772 500 752 500 L612 500 L572 440 Z"
          fill="#FF4D6D" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>
    <circle cx="604" cy="440" r="12" fill="#3B1460"/>
    <!-- símbolo % -->
    <g fill="#FFFFFF">
      <circle cx="660" cy="414" r="15"/>
      <circle cx="722" cy="466" r="15"/>
      <rect x="682" y="392" width="16" height="96" rx="8" transform="rotate(38 690 440)"/>
    </g>
  </g>
  <!-- cordinha da etiqueta -->
  <path d="M558 400 Q 585 418 590 432" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>

  <!-- brilhinhos -->
  <g fill="#FFE08A">
    <path d="M300 300 l14 38 l38 14 l-38 14 l-14 38 l-14 -38 l-38 -14 l38 -14 z"/>
    <path d="M760 690 l9 24 l24 9 l-24 9 l-9 24 l-9 -24 l-24 -9 l24 -9 z" opacity="0.9"/>
    <path d="M262 660 l7 18 l18 7 l-18 7 l-7 18 l-7 -18 l-18 -7 l18 -7 z" opacity="0.8"/>
  </g>
</svg>
