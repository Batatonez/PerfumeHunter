# Scentinel: catálogo de perfumes cobiçados (o que o canal de promos caça sozinho)
#
# Cada [[perfumes]]:
#   nome, marca, concentracao (EDT/EDP/Parfum/Elixir/Extrait/Colônia; vazio = qualquer)
#   ml           tamanhos aceitos (anúncio de outro tamanho é ignorado)
#   ml_ref       tamanho do preço de referência
#   preco_normal preço NORMAL de mercado (de rua) no ml_ref, em R$
#   preco_bom    abaixo disso o bot posta "💸 PREÇO BOM" mesmo sem desconto grande
#   busca        termos usados na busca das lojas (o primeiro é o principal)
#   evitar       palavras que indicam OUTRO produto (flanker, versão, variação)
#   publico      masc | fem | unissex      categoria  designer | nicho | arabe | nacional
#
# ⚠️ Os preços são ESTIMATIVAS (out/2026) de preço de rua no Brasil. O bot usa sempre a MENOR
# referência entre: este preço, o histórico real de 30 dias e o "de R$" da loja. Ajuste à vontade.

