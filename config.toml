# Scentinel: ajustes
# Depois de mudar algo aqui: sudo systemctl restart scentinel

[geral]
# Intervalo mínimo entre checagens do MESMO anúncio, em horas.
# Educação com as lojas: o bot não aceita menos que 3.
intervalo_horas = 3

# Espera aleatória entre uma requisição e outra (segundos). Mínimo 5.
delay_min_s = 5
delay_max_s = 15

# De quanto em quanto tempo o bot olha se tem anúncio vencido (minutos).
tick_minutos = 10

# Nível mínimo pra mandar aviso (1 = Cheirinho).
nivel_minimo_aviso = 1

# No /locate, se a última checagem de um anúncio tiver mais que isso (horas),
# ele checa de novo na hora. Nunca fica abaixo de intervalo_horas.
locate_rechecar_apos_horas = 6

# O /checar ignora o intervalo de 3 h, mas pula quem foi checado há menos disso (minutos).
checar_forcado_min_minutos = 30

fuso = "America/Sao_Paulo"

[referencia]
# Preço de referência = mediana dos últimos `dias`, se tiver pelo menos `min_leituras`.
dias = 30
min_leituras = 5

[sanidade]
# Queda maior que isso (%) -> baixa a página de novo antes de avisar.
queda_pct = 60
rechecar_apos_s = 120
# A 2ª leitura confirma se não estiver mais que isso (%) acima da 1ª.
tolerancia_pct = 2

[bloqueio]
# Se a loja bloquear (403/429/captcha): espera e dobra a cada novo bloqueio.
backoff_horas = 6
backoff_max_horas = 48

# Sobrescreve o nivel_minimo_aviso pra um perfume específico (nome como no /add).
[nivel_minimo_por_perfume]
# "Sauvage EDP" = 2

# ------------------------------------------------------------
# Níveis de promo (desconto vs preço de referência)
# ping = marca o dono · everyone = marca @everyone · rechecar = baixa de novo antes de avisar
# (pro @everyone funcionar, o bot precisa da permissão "Mencionar @everyone": use o link de convite do README)
# cores: degradê do azul da foto do bot (claro -> forte, 💎 elétrico)
# ------------------------------------------------------------

[[niveis]]
nivel = 1
nome = "Cheirinho"
emoji = "🟢"
min_pct = 10
cor = "#A1A4E8"
ping = false

[[niveis]]
nivel = 2
nome = "Elogio"
emoji = "🟡"
min_pct = 20
cor = "#7D82DE"
ping = false

[[niveis]]
nivel = 3
nome = "Rastro"
emoji = "🟠"
min_pct = 30
cor = "#4F55E0"
ping = false

[[niveis]]
nivel = 4
nome = "Fera"
emoji = "🔴"
min_pct = 40
cor = "#2024CC"
ping = true

[[niveis]]
nivel = 5
nome = "Bug de preço"
emoji = "💎"
min_pct = 50
cor = "#00C8FF"
ping = true
everyone = true
rechecar = true

# ------------------------------------------------------------
# Busca automática (canal de promos): o bot procura sozinho os perfumes do
# catalogo.toml nas lojas abaixo e posta as melhores ofertas.
# ------------------------------------------------------------
[descoberta]
ativo = true
# Cada perfume é buscado em cada loja no máximo a cada X horas (mínimo 3).
intervalo_horas = 6
# Só posta a partir desse nível (2 = 20% abaixo do preço de referência).
nivel_minimo = 2
# Quantos produtos de cada busca entram na análise.
max_por_busca = 6
# Trava anti-enxurrada.
max_alertas_por_hora = 10
# Mesmo perfume e tamanho mais barato em outra loja -> posta só o mais barato.
so_menor_preco = true
# 🏆 Top do dia (horário de Brasília; "" desliga) e quantos itens.
top_diario = "19:00"
top_n = 5

# Vitrine: a cada X minutos, em horário redondo (com 15: 10:00, 10:15, 10:30...), posta a melhor oferta que
# o bot conhece (promo primeiro), tentando não
# repetir o mesmo perfume por `vitrine_sem_repetir_horas`. Se acabar o que mostrar, repete o mais antigo.
# 0 desliga (aí só sai post quando aparece promo).
vitrine_minutos = 15
vitrine_sem_repetir_horas = 72
# VARREDURA (estilo canal de promos): de hora em hora percorre as ofertas de perfume das lojas
# e posta QUALQUER perfume em promo boa (não só os do catálogo), maiores descontos primeiro.
varredura = true
varredura_minutos = 60
# Miniatura e coisa barata demais ficam de fora.
ml_min = 30
preco_min = 40
# Perfume fora do catálogo só é guardado se a loja anunciar pelo menos esse desconto (%).
desconto_min_rastrear = 10
# Confiança: só posta loja oficial (ML) / vendido pela própria loja (VTEX, sem parceiros do marketplace).
so_oficial = true
# No máximo quantos @everyone por dia (depois disso, o 💎 marca só o dono).
max_everyone_por_dia = 2

# Que perfume o canal posta: "masculino" (masculino + unissex) ou "todos".
# O /locate sempre mostra tudo o que você pesquisar.
publico = "masculino"

# Lojas onde o bot procura. Hoje: SÓ o Mercado Livre (loja oficial), que é o mais seguro.
# As outras ficam desligadas (`ativo = false`); pra religar uma, troque pra `ativo = true` e reinicie.
# `.venv/bin/python -m scentinel lojas` testa todas (inclusive as desligadas).
# categorias: o que procurar nessa loja (designer, nicho, arabe, nacional; vazio = tudo)
# marcas:     só esses perfumes (vazio = todos)

[[descoberta.fontes]]
tipo = "mercadolivre"
# Perfume falsificado é comum no ML: o canal só posta loja oficial e vendedor comum bem avaliado
# (MercadoLíder Gold/Platinum com termômetro verde). O /locate mostra todo mundo.
so_loja_oficial = true
vendedor_bem_avaliado = true
# Busca no SITE do ML com um Chromium escondido: desligada. O ML bloqueia navegador automático
# (pede verificação), então ela só gastava memória. O bot usa o catálogo da API, que é o que o ML libera.
navegador = false
site_na_varredura = false
# Precisa do login uma vez: python -m scentinel ml-login (veja o README).
# Com login, a varredura pega os mais vendidos das categorias de perfume e busca estes termos no
# catálogo do ML (cada produto: o vendedor oficial mais barato). Sem login, só a página (captcha).
termos_varredura = ["perfume masculino", "perfume feminino", "perfume importado", "perfume arabe",
                    "eau de parfum", "eau de toilette", "perfume nicho", "perfume unissex"]
# (com publico = "masculino", os termos femininos são pulados sozinhos)
# categorias_varredura = ["MLB6284"]   # vazio = descobre sozinho as de perfume

